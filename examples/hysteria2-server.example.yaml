# /etc/hysteria/config.yaml — Hysteria2 服务端模板（版本锁 v2.12.2）
# 部署见 AGENT_RUNBOOK.md §6；权限 root:hysteria 640
# ⚠️ acl.inline 是硬要求（HY2 默认无目标过滤）；reject(cidr) 省略端口=拒全部端口

listen: :443

tls:
  cert: /etc/hysteria/cert.pem
  key: /etc/hysteria/key.pem

auth:
  type: password
  password: <HY2_PASSWORD>

disableUDP: true

acl:
  inline:
    - reject(169.254.0.0/16)
    - reject(0.0.0.0/8)
    - reject(10.0.0.0/8)
    - reject(100.64.0.0/10)
    - reject(127.0.0.0/8)
    - reject(172.16.0.0/12)
    - reject(192.168.0.0/16)
    - reject(198.18.0.0/15)
    - reject(224.0.0.0/4)
    - reject(::1/128)
    - reject(fc00::/7)
    - reject(fe80::/10)
